# JRA 打包配置。等号两边不要空格。路径相对 JavaRemoteAssistant/（pack 的上一级）。

# —— 必填 ——
APP_NAME=JavaRemoteAssistant
MAIN_CLASS=application.App
MAVEN_JAR=target/JRA_Client-4.2.0.jar

# —— 建议核对 ——
VENDOR=Ryan Yim
APP_DESCRIPTION=Java Remote Assistant
VERSION=4.2.0
VERSION_JAVA=src/main/java/application/App.java
# Debian 包名必须全小写；安装目录由 pack-deb.sh 改到 /opt/JavaRemoteAssistant
LINUX_PKG_NAME=javaremoteassistant

ICON_PNG=src/main/resources/application/icon.png
ICON_ICO=other/icon.ico
ICON_ICNS=other/icon.icns

JP_MODULES=java.base,java.desktop,java.datatransfer,java.prefs,jdk.charsets,javafx.base,javafx.graphics,javafx.controls,javafx.fxml
JAVAFX_JMODS=
MAVEN_EXTRA_ARGS=
JAVA_OPTIONS=-Dfile.encoding=UTF-8
MENU_GROUP=Utility
