# GUI（JRA）与 CLI（deploy）共用。不要在 JRA 里再写一份。
# 模块专用仍在：zerotier.conf / tightvnc.conf / frpc.conf（可加密为 .eonf）
# 等号两边不要空格。

# 仅 Dayon：assisted=受助端连出 | assistant=协助端等待接入。VNC 不读这项
role=assisted
# 帮助者地址（Dayon 受助端连出；TightVNC 反向连接 Viewer）
host=127.0.0.1
port=8080
auto_accept=1
# 桌面层：auto | dayon | vnc | tightvnc | rdp
# auto = Windows→tightvnc，Linux→dayon（推荐）
# GUI：加载按钮右箭头选方式；右击打开高级设置
# Linux 菜单仅 Dayon / VNC（无 RDP）；Windows 另有 RDP 占位
desktop=vnc
# TightVNC 部署方式：portable=便携 RAServer（左键加载）| service=系统服务（高级部署）
tightvnc_mode=portable
# Linux VNC 显示号：0=当前屏(:0)；1/2/3/4…=虚拟桌面（本轮只做 :0）
vnc_display=0
# Linux VNC 连接：reverse=反向连出协助端 Viewer | listen=等待对方连本机 :5900
vnc_connect=reverse
# Linux VNC 实现：auto=推荐 x11vnc（可反向连出）| x11vnc | tigervnc（x0vncserver，只监听）
vnc_impl=auto
# Linux VNC 传输：0=不加密（TightVNC Viewer 能连）| 1=TLS（协助端需 TigerVNC 等支持 TLS 的 Viewer）
vnc_encrypt=0
# Linux VNC 密码（空=不设密码，仅局域网/VPN）
vnc_passwd=
# 多显示器：all | primary | 1 | 2 …（不设虚拟二屏；引擎支持时生效）
monitor=all
# 网络层：none | zerotier | frp
network=none
# JRA 窗口默认置顶：1 开 / 0 关（界面里也可勾选）
always_on_top=1
# 体验版：1=主界面完整体验（状态/按钮），不真装不启进程（JRA设置可改）
dry_run=0
# 体验版模拟平台：auto | linux | windows（Linux 上选 windows 可体验 TightVNC/AHK）
simulate_os=windows
# Linux：1=source 指定文件再找 python3（终端 venv）；0=用 JRA 自己的 PATH
use_shell_env=1
# source 哪份：auto=按 SHELL 推荐；或填绝对路径（~/.zshrc、venv/bin/activate …）
shell_source=auto
# 系统托盘：1 开 / 0 关（不弹关不掉的气泡）
tray=1
# 点窗口关闭：1=缩到托盘（默认）/ 0=直接退出（JRA设置可改）
close_to_tray=0
# 本机客户端 IP（主界面下拉；记忆；会同步 frpc local_ip）
client_ip=192.168.2.143
# 各辅助按钮倒计时（秒，0=立即；主界面滚轮改，会记住）
delay_system_monitor=0
delay_show_desktop=0
delay_desktops=0
delay_ime=0
delay_keyboard=5
delay_ahk=5
# AHK：默认用包根 res/windows/AHK/（与 TightVNC 同级共用）；可覆盖
ahk_dir=
ahk_exe=
ahk_script=sample
# 显示桌面 / 切换工作区 / 本机辅助热键：auto 或长按所选（可自定义录制）
hotkey_show_desktop=auto
hotkey_switch_desktop=auto
# linux 切工作区后端：java（默认，只靠 Robot）| xdotool（可选）
hotkey_switch_backend=java
hotkey_show_custom=
hotkey_switch_next=
hotkey_switch_prev=
hotkey_switch_new=
hotkey_task_manager=auto
hotkey_task_manager_custom=
hotkey_ime=auto
hotkey_ime_custom=
hotkey_osk=auto
hotkey_osk_custom=
